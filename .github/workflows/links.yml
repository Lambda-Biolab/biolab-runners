---
name: Link Checker

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "00 00 * * 0"

jobs:
  check-links:
    runs-on: ubuntu-latest
    # Default token has `contents: read`; we re-declare permissions to
    # also grant `issues: write` for the create-issue-from-file step.
    # Listing only `issues: write` would drop `contents: read` and
    # the actions/checkout step would fail with a 403 — that was the
    # cause of the long-running `startup_failure` before this fix.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "lychee: broken links detected"
          content-filepath: ./lychee/out.md
          labels: report, automated issue
