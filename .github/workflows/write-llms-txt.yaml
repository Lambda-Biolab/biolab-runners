name: Write llms.txt

"on":
  push:
    branches: [main]
    paths:
      - ".github/templates/llms.txt.tpl"
      - "biolab_runners/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  write-llms-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set BLOB URL
        id: vars
        run: echo "BLOB=https://github.com/${{ github.repository }}/blob/${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Render llms.txt from template
        run: envsubst < .github/templates/llms.txt.tpl > llms.txt

      - name: Check for changes
        id: detect
        run: |
          git add llms.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@4320041ed380b20e97d388d56a7fb4f9b8c20e79 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "docs: update llms.txt"
          title: "docs: update llms.txt"
          body: "Auto-generated from `.github/templates/llms.txt.tpl`."
          branch: auto/llms-txt-${{ github.run_id }}
          add-paths: llms.txt
          delete-branch: true
