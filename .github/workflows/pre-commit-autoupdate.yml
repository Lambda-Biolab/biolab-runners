name: pre-commit autoupdate

# Weekly: bump pre-commit-hooks and conventional-pre-commit revs in
# .pre-commit-config.yaml via `pre-commit autoupdate`. Dependabot
# does not have a native `pre-commit` package-ecosystem, so this
# workflow is the org's substitute. Bumps are committed to a new
# branch and opened as a PR; the full CI gate then confirms the
# new hooks still pass before merge.
#
# Manual trigger: workflow_dispatch (for ad-hoc bumps).
# Skip condition: skip if the file doesn't exist (not all repos
# use pre-commit yet).

"on":
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoupdate:
    name: Bump pre-commit revs
    runs-on: ubuntu-latest
    if: hashFiles('.pre-commit-config.yaml') != ''
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-python@83679a423a8f7177e4b3a13bff910de9898b9afa # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit autoupdate
        # --bleeding-edge: pull the latest tag including -rc versions
        # so we don't miss security updates. Stable-only is the
        # default behavior of `pre-commit autoupdate` without flags.
        run: pre-commit autoupdate --bleeding-edge

      - name: Open PR with bumps
        uses: peter-evans/create-pull-request@5f8c9349dc9f1a0d1f9c4dd2adaa6e70fd7d8c1e # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(pre-commit): autoupdate hooks via pre-commit autoupdate"
          title: "chore(pre-commit): autoupdate hooks"
          body: |
            Weekly automated bump of pre-commit-hooks and conventional-pre-commit revs in `.pre-commit-config.yaml`.

            Generated by the `pre-commit autoupdate` workflow. Please review the diff and confirm CI passes before merging. The full CI gate (lint, type, complexity, tests) runs on this PR — if the new hooks break anything, this PR is the place to find out.

            - `pre-commit autoupdate` ran with `--bleeding-edge` so the latest tags (including -rc releases) are picked up. Stable-only is the default; flag this if you want it tightened.
            - If the PR is empty, the workflow skipped — no upstream revs changed this week.
          branch: chore/pre-commit-autoupdate
          delete-branch: true
