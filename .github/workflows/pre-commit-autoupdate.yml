name: pre-commit autoupdate

# Weekly: bump pre-commit-hooks and conventional-pre-commit revs in
# .pre-commit-config.yaml via `pre-commit autoupdate`. Dependabot
# does not have a native `pre-commit` package-ecosystem, so this
# workflow is the org's substitute. Bumps are committed to a new
# branch and opened as a PR; the full CI gate then confirms the
# new hooks still pass before merge.
#
# Manual trigger: workflow_dispatch (for ad-hoc bumps).

"on":
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoupdate:
    name: Bump pre-commit revs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit autoupdate
        # --bleeding-edge: pull the latest tag including -rc versions
        # so we don't miss security updates. Stable-only is the
        # default behavior of `pre-commit autoupdate` without flags.
        run: pre-commit autoupdate --bleeding-edge

      - name: Open PR with bumps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "No upstream revs changed"
            exit 0
          fi

          branch="chore/pre-commit-autoupdate-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$branch"
          git add .pre-commit-config.yaml
          git commit -m "chore(pre-commit): autoupdate hooks"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(pre-commit): autoupdate hooks" \
            --body "Weekly automated bump generated by pre-commit autoupdate --bleeding-edge."
