name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

# Cancel in-progress runs for the same PR — pushes in rapid succession
# shouldn't pile up queued jobs that all do the same work. Canceling
# older runs frees the runner slot for the next push immediately.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Biolab-runners CI bundle.
#
# Design goals (post-mortem from the PR #162 queue-storm):
# 1. Default CI must NOT install boltz/torch/rdkit. Those are heavy ML
#    deps only needed for the smoke-test job on a GPU runner. Default
#    CI installs only --extra openmm (openmm + pdbfixer + numpy + mdtraj),
#    which is enough to run the unit-test suite that mocks the boltz CLI.
# 2. Each check is its own job so a single failure doesn't hide the rest.
#    Reviewers see "lint failed" not just "CI failed" — the specific
#    gate that broke is visible.
# 3. concurrency.cancel-in-progress cancels superseded runs on the
#    same PR. This was the structural fix for the runner-pool queue:
#    pushing twice in 10s no longer doubles the queued job count.
# 4. All jobs have timeout-minutes so a hung job can't tie up a runner
#    indefinitely. 10 min is comfortable headroom — actual jobs
#    finish in 1-2 min each.
# 5. The boltz-deps-resolve job is opt-in (workflow_dispatch only). It
#    validates that biolab-runners[all] can be resolved and imported,
#    catching future dep-resolution breakages (like the boltz/mdtraj
#    numpy conflict that broke Dependabot). 5-min budget; runs as a
#    separate workflow so it doesn't slow down the default gate.
#
# The smoke-test job uses a self-hosted GPU runner (no GitHub-hosted
# minutes), tag/manual only. Not part of the default PR gate.

jobs:
  # Fast-fail: catches workflow-syntax bugs in <1s, before the slow
  # Python install steps. PR #162's pre-commit actionlint hook catches
  # the same class of bug locally, so this is a belt-and-suspenders gate.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install + run actionlint
        shell: bash
        run: |
          bash scripts/install-actionlint.sh
          actionlint -color

  # Static checks (format + lint + complexity). Fast (<5s total). Runs
  # on a single Python version because these checks don't depend on
  # the interpreter version.
  static-checks:
    name: static checks (format, lint, complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev deps only
        # --no-install-project skips installing the project itself
        # (we only need ruff + complexipy for these checks). Saves a
        # few seconds on cold cache.
        run: uv sync --frozen --no-install-project --group dev
      - name: Format check
        run: uv run ruff format --check biolab_runners/ tests/
      - name: Lint
        run: uv run ruff check biolab_runners/ tests/
      - name: Complexity gate
        run: uv run complexipy biolab_runners/ --max-complexity-allowed 15

  # Type check + tests. Heavy (numpy, openmm, mdtraj install) but only
  # the openmm extra — boltz/torch/rdkit are NOT installed (those live
  # in the smoke-test job, which runs on a GPU runner, not here).
  # Matrix [3.11, 3.12] matches the supported Python range
  # (requires-python = ">=3.11"). fail-fast: false so a failure on 3.11
  # doesn't cancel the 3.12 run (useful when one version has a known
  # transient issue).
  typecheck-test:
    name: typecheck + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Register PAT for private bioml-tools fetch
        # The [openmm] extra pins ``bioml-tools @ git+...v1.9.0`` to
        # the private Lambda-Biolab/bioml-tools repo. Default
        # GITHUB_TOKEN can't reach cross-org private deps. We use
        # gh auth setup-git to register a credential helper for
        # ``git fetch`` of private repos, then uv (which shells
        # out to git) inherits the helper. Follow-up: publish
        # bioml-tools to PyPI and remove this step.
        #
        # Note: the env var must NOT be named GH_TOKEN — gh
        # refuses to authenticate when GH_TOKEN is set in the
        # environment, since it interprets the variable as a
        # pre-existing session and skips the login flow. Pass it
        # through a different name and pipe it via stdin.
        env:
          BIOML_PAT: ${{ secrets.GH_BIOML_TOOLS_TOKEN }}
        run: |
          echo "$BIOML_PAT" | gh auth login --with-token
          gh auth setup-git
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install with --extra openmm (NOT --all-extras)
        # biolab-runners[openmm] = openmm + pdbfixer + numpy + mdtraj.
        # These are required by the test suite (mdtraj for offline_gate
        # tests, openmm via test imports). biolab-runners[boltz2]
        # (boltz + torch + pytorch-lightning + rdkit) is the heavy
        # ML dep set and is OPT-IN: only the smoke-test job below
        # installs it, and only on the self-hosted GPU runner.
        # Saves ~30s of cold-cache install time per CI invocation.
        run: uv sync --frozen --extra openmm --group dev
      - name: Type check
        run: uv run pyright biolab_runners/ tests/
      - name: Test
        run: uv run pytest tests/ -v --tb=short

  # CodeQL runs independently of the Python jobs. ~50s. Mandatory on
  # every PR — security findings must block the merge, not land
  # post-merge.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: sarif-results
      - name: Dismiss alerts
        if: always()
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Smoke test — full boltz + openmm + cuda. Self-hosted GPU runner
  # only (no GitHub-hosted minutes consumed). Tag-triggered for
  # release validation, manual dispatch for ad-hoc verification.
  smoke-test:
    name: smoke test (GPU)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install with --all-extras (boltz + torch + rdkit)
        # The smoke test exercises the boltz CLI end-to-end, so it
        # needs the heavy ML dep set. ~5 min on cold cache; ~30s warm.
        run: uv sync --frozen --all-extras --group dev
      - name: Run smoke test
        run: make smoke_test

  # SBOM — schedule/manual only. Doesn't fire on PRs.
  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: qte77/gha-sbom-action@cd873b1278a6793a99cfe199c01d603d72cca717 # v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Link Checker — schedule/manual only. The push and pull_request
  # triggers were removed (PR #163) because they were flooding the
  # runner pool: every push fired a fresh lychee run, each consuming
  # a slot. Catching broken links pre-merge is the job of the PR
  # close trigger; catching external link rot is the job of the
  # weekly schedule.
  links:
    name: Link Checker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lychee link check
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config .lychee.toml ."
          fail: true
