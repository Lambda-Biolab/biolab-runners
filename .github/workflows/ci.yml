name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# This is the standard Python project CI bundle, biolab-runners
# flavor. Mirrors templates/python-repo/.github/workflows/ci.yml
# with the biolab-runners-specific bits:
# - python-versions matrix: ['3.11', '3.12'] (the biolab-runners
#   supported range)
# - extra-deps: --extra openmm (the biolab-runners runtime dep)
# - smoke-test: self-hosted GPU runner, tag/manual only
# - complexity-threshold: 15 (the standard; bioml-tools uses 22
#   for the documented exception)

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: actionlint (GitHub Actions workflow linter)
        # Lints .github/workflows/*.yml in this repo for syntax errors,
        # context-availability bugs (hashFiles() in job-level if:),
        # unknown runner labels, etc. Found biolab-runners' links.yml
        # reusable-workflow-not-found bug and the per-pr-gate hashFiles()
        # context bug. Runs BEFORE lint so a bad workflow blocks before
        # the slow Python install steps.
        shell: bash
        run: |
          bash scripts/install-actionlint.sh
          actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        # --extra openmm brings openmm + pdbfixer + numpy + mdtraj.
        # Without --all-extras we skip boltz2 (requires the boltz
        # binary on PATH and a GPU, not needed for the unit-test
        # suite, which mocks the CLI). Saves ~30 s per CI run.
        run: uv sync --frozen --extra openmm --group dev
      - name: Format check
        run: uv run ruff format --check biolab_runners/ tests/
      - name: Lint
        run: uv run ruff check biolab_runners/ tests/
      - name: Type check
        # Tests are first-class code.
        run: uv run pyright biolab_runners/ tests/
      - name: Complexity gate
        run: uv run complexipy biolab_runners/ --max-complexity-allowed 15
      - name: Test
        run: uv run pytest tests/ -v --tb=short

  # Smoke test job — requires a self-hosted runner with a CUDA-capable
  # GPU and OpenMM built with CUDA support (not available on GitHub-hosted
  # runners). Trigger manually with `workflow_dispatch` after the lint
  # gate is green. Run on tagged releases for an end-to-end check.
  smoke-test:
    runs-on: [self-hosted, gpu]
    needs: lint-type-test
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        # Smoke test needs the boltz2 extra too (the boltz CLI is
        # referenced indirectly through biolab_runners imports).
        run: uv sync --frozen --all-extras --group dev
      - name: Run smoke test
        run: make smoke_test

  codeql:
    name: CodeQL
    # CodeQL MUST run on every PR so security findings block the
    # merge instead of showing up post-merge. The hosting workflow's
    # `on: pull_request:` trigger (set at the top of this file)
    # already defines the PR event — the old `if:` filter dropped it,
    # which downgraded CodeQL to post-merge advisory.
    #
    # The "merge-ref SHA races merge-protection" concern that the old
    # filter guarded against does not apply to `pull_request` triggers
    # on the workflow's own `on:` block — only to a hypothetical
    # `pull_request` trigger on a reusable file (which this inline
    # codeql isn't). Mirroring the org rule documented in
    # antomicblitz/opencode-config/templates/python-repo/.github/workflows/ci.yml.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: sarif-results
      - name: Dismiss alerts
        if: always()
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: qte77/gha-sbom-action@cd873b1278a6793a99cfe199c01d603d72cca717 # v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: Link Checker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config .lychee.toml ."
          fail: true
