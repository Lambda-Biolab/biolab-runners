name: secrets

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    # Gitleaks v3.0.0 makes its own API calls (e.g. listing PR commits
    # for the PR-specific scan). The workflow-level `contents: read`
    # is too restrictive — add `pull-requests: read` so the action
    # can fetch PR data on Dependabot and human PRs alike. Without
    # this, the action errors with "Resource not accessible by
    # integration" (HTTP 403) when trying to call
    # /repos/.../pulls/{n}/commits. The license check (gitleaks.io
    # API) is a separate call and uses GITLEAKS_LICENSE directly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"  # Pin gitleaks binary. Single source of truth across CI + local install_tools Makefile target. 8.30.1 is the latest stable; matches install_tools in Makefile.
