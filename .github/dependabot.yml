---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Note on pre-commit-hooks and conventional-pre-commit rev pins
  # in .pre-commit-config.yaml: Dependabot does not have a native
  # `pre-commit` package-ecosystem. Bump them manually with
  #   uv run pre-commit autoupdate
  # and verify the new hooks pass before merging.

# Grant Dependabot PRs access to the GITLEAKS_LICENSE secret so the
# gitleaks CI scan can run on dependency bumps. Without this, the
# `secrets.GITLEAKS_LICENSE` env on the `gitleaks/gitleaks-action`
# step is empty on Dependabot PRs (GitHub's default is to NOT pass
# repo secrets to Dependabot for security reasons).
secrets:
  GITLEAKS_LICENSE:
    description: "Gitleaks Pro license (free for orgs, required for v3.0+ on org accounts)"
    required: true
