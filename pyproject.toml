[project]
name = "biolab-runners"
version = "0.4.0"
description = "Standalone modular runners for Boltz-2 structure prediction and OpenMM MD simulations"
requires-python = ">=3.11"
authors = [{ name = "Lambda-Biolab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["boltz2", "openmm", "structure-prediction", "molecular-dynamics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = []

[project.optional-dependencies]
boltz2 = [
    "boltz>=2.2",
    # PyYAML is intentionally NOT listed here — boltz pins pyyaml==6.0.2
    # exactly. Adding a loose constraint here makes biolab-runners[all]
    # unsatisfiable (pyyaml==6.0.3 vs pyyaml==6.0.2). boltz's transitive
    # dependency on pyyaml is what installs it.
]
openmm = [
    "openmm>=8.5.2",
    "pdbfixer>=1.9",
    # numpy<2.0: boltz>=2.2 requires numpy>=1.26,<2.0, and the biolab-runners
    # [all] extra combines boltz2 + openmm so the same numpy version must
    # satisfy both. Dropping this upper bound causes dependabot to fail with
    # "your project's requirements are unsatisfiable" on every weekly run.
    "numpy>=1.26,<2.0",
    # Offline MD early-abort gate (biolab_runners.openmm.offline_gate) —
    # loads partial trajectory.dcd between production sub-chunks and
    # evaluates peptide-Cα RMSD with triclinic-aware unwrap. Replaces
    # the pre-task-#10 inside-OpenMM gate.
    # mdtraj<1.11.1: mdtraj 1.11.1.post2 requires numpy>=2.0,<2.5 which
    # conflicts with boltz's numpy<2.0 constraint. 1.11.0 is the last
    # release compatible with the numpy 1.x line.
    "mdtraj>=1.10,<1.11.1",
    # CUDA platform plugin for OpenMM 8.5+. The [cuda12] extra installs
    # the prebuilt C++ plugin against CUDA 12.x; openmm ships matching
    # extras for CUDA 12 and CUDA 13 — pin whichever matches the host's
    # installed CUDA toolkit (this machine has CUDA 12.9 at
    # /usr/local/cuda-12.9/, so [cuda12] is the right selector). On a
    # workstation where nvidia-smi works but /dev/nvidia* is missing
    # from the agent's mount namespace, see the opencode systemd drop-in
    # fix described in ../docs/testing/scientific-validation.md and
    # /home/antonio/.local/bin/enable-opencode-gpu-systemd.sh.
    "openmm[cuda12]",
]
all = [
    "biolab-runners[boltz2,openmm]",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov",
    "complexipy>=6.2.0",  # Pinned — Dependabot's group resolution downgrades to 0.8 (unrelated). 6.2.0 is the standard across the org.
    "pre-commit>=3.5",
    "hypothesis>=6.164.0",
    "numpy>=1.26",  # required by the OpenMM runner Kabsch-aligned RMSD tests
    "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biolab_runners"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["biolab_runners", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "N",   # pep8-naming
    "S",   # bandit (security)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "C90", # mccabe cyclomatic complexity
    "RUF", # ruff-specific rules
    "ANN", # flake8-annotations
    "PT",  # flake8-pytest-style
]
ignore = [
    "D100",  # missing module docstring (allow for __init__.py)
    "D104",  # missing public package docstring
    "D107",  # missing docstring in __init__
    "S603",  # subprocess call — pipeline shells out to boltz CLI
    "S607",  # partial path for subprocess — boltz binary is on PATH
    "S602",  # subprocess shell — not used
    # RUF001/002/003: ambiguous unicode (e.g. "α" instead of "a"). This
    # is a computational-biology library where Greek letters, ×, −, and
    # similar glyphs are correct domain notation (Cα, RMSD, ångström),
    # not ambiguous characters. ASCII transliteration would hurt
    # readability for the intended audience.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",     # docstring rules (tests are self-documenting via test names)
    "S",     # security (asserts, subprocess mocks are safe in tests)
    "ARG",   # unused arguments (fixtures may pass extras)
    "TC002", # type-checking block (tests import FloatArray from offline_gate for annotations)
    "TC003", # type-checking block (tests import broadly)
    "SIM117", # combine multiple with statements (test readability)
    "ANN",   # annotations (tests use pytest fixtures; full annotations noisy)
    "PT",    # pytest-style (existing tests use class grouping, not function-style)
    "N802",  # camelCase function names (test mocks mirror OpenMM's camelCase API)
    "N815",  # mixedCase in class scope (test mocks mirror OpenMM's mixedCase attrs)
]

# --- Pyright ---
[tool.pyright]
# Type-check both production code AND tests. Tests are first-class code:
# they ship in the repo, they're reviewed, they have a coverage gate.
# The "mock infrastructure noise" rationale (hypothesis decorators, etc.)
# applies to bioml-tools' hypothesis stubs, not biolab-runners — the
# errors that surface when tests/ is included are real type issues in
# production code (e.g. `to_dict()` returning `object` instead of
# `dict[str, object]`). Letting them through the gate hides real bugs.
include = ["biolab_runners", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# `mdtraj` is an optional dep under the `openmm` extra; imported lazily
# inside `biolab_runners/openmm/offline_gate.py`. Pyright can't see the
# dep unless the extra is installed, so silence the missing-import
# diagnostic specifically.
reportMissingImports = "warning"
# Third-party stub-gap suppressions — biolab-runners depends on packages
# with partial/incomplete type stubs (openmm, pdbfixer, mdtraj, boltz).
# Strict mode promotes several "Unknown" diagnostics to errors; these
# are pyright not knowing what `openmm.System.addParticle(int)` returns,
# not real bugs in our code. Same rationale as the bioml-tools config.
# Disabled rules (real errors fixed in source; these are pure noise):
#   reportMissingTypeStubs — openmm, pdbfixer, mdtraj, openmm.unit
#   reportUnknownMemberType, reportUnknownVariableType,
#     reportUnknownArgumentType, reportUnknownParameterType —
#     cascading Unknown from the stub gaps above
#   reportAttributeAccessIssue — openmm/boltz internal attribute access
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
# Test-mock-infrastructure suppressions — strict mode flags patterns that
# are inherent to MagicMock-heavy unit tests, not real type issues:
#   reportPrivateUsage — tests intentionally exercise _protected methods
#     to verify internal contracts (e.g. `_build_command`, `_kabsch_rotation`).
#     Renaming every internal method to be public would leak implementation
#     details into the public API. Production code does NOT use the
#     underscored names from other modules.
#   reportUnknownLambdaType — lambdas used as `side_effect` callbacks on
#     MagicMock have no inferred type for their parameter (it comes from
#     the mock's __call__ signature, which is `Any`). Production code uses
#     def functions, not lambdas, for typed callbacks.
reportPrivateUsage = false
reportUnknownLambdaType = false
# Hypothesis decorators (@given, @settings) are untyped by design; they
# obscure the inner function's signature in pyright's strict mode. This
# is a known third-party-stub gap, not a real type bug. Same rationale
# as the bioml-tools config (see AGENTS.md "Pyright mode" section).
reportUntypedFunctionDecorator = false

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=biolab_runners",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "integration: scientific-validation tier (tests/integration/test_scientific_validation.py) — runs under default -m 'not slow' because the suite depends on committed fixtures (no external binaries required except the heavy OpenMM CUDA smoke gated by BIOLAB_RUN_HEAVY_CUDA_TESTS=1). Reserved for future opt-in tiers that need real external binaries.",
]

# --- Coverage ---
[tool.coverage.run]
branch = true
source = ["biolab_runners"]
omit = [
    "biolab_runners/__init__.py",
]

[tool.coverage.report]
# Threshold enforced via `make validate` → pytest → --cov-fail-under below.
# Current floor: 70%. Aspirational target: 80% (needs integration tests
# for runner.py/system_builder.py OpenMM-coupled paths).
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --- Mutation testing (mutmut) ---
# Mutation testing is local-only (pre-push hook via make mutate-changed).
# See CONTRIBUTING.md "Mutation Testing" section for the architecture.
# The source_paths and pytest_add_cli_args_test_selection lists are
# what  mutates. Adding new modules here is the
# only required setup; the Makefile target auto-detects changed files.
[tool.mutmut]
source_path = ["biolab_runners"]
# The integration suite (`tests/integration/`) runs real OpenMM MD
# against the barnase chain A fixture. It depends on GPU/CUDA
# availability and takes ~90 s per run on RTX 4090. Mutmut's
# pytest.main() exec is broken in this repo's mutants/ cwd (the
# mutants/ tree is missing pyproject.toml and a README, so pytest
# collection reports ImportError for openmm even though openmm
# imports fine via os.chdir). Exclude integration tests from
# mutation: their correctness is covered by `make validate`'s
# normal pytest run; mutmut's job is to catch regressions in the
# source modules the integration suite calls into.
pytest_add_cli_args = ["--no-cov", "--tb=short", "-q", "--ignore=tests/integration"]
pytest_add_cli_args_test_selection = ["tests"]
