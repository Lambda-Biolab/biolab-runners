[project]
name = "biolab-runners"
version = "0.1.0"
description = "Standalone modular runners for Boltz-2 structure prediction and OpenMM MD simulations"
requires-python = ">=3.11"
authors = [{ name = "Lambda-Biolab" }]
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["boltz2", "openmm", "structure-prediction", "molecular-dynamics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = []

[project.optional-dependencies]
boltz2 = [
    "boltz>=2.2",
    "PyYAML",
]
openmm = [
    "openmm>=8.5.2",
    "pdbfixer>=1.9",
    "numpy>=1.26",
    # Offline MD early-abort gate (biolab_runners.openmm.offline_gate) —
    # loads partial trajectory.dcd between production sub-chunks and
    # evaluates peptide-Cα RMSD with triclinic-aware unwrap. Replaces
    # the pre-task-#10 inside-OpenMM gate.
    "mdtraj>=1.10",
]
all = [
    "biolab-runners[boltz2,openmm]",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov",
    "complexipy>=6.2.0",  # Pinned — Dependabot's group resolution downgrades to 0.8 (unrelated). 6.2.0 is the standard across the org.
    "pre-commit>=3.5",
    "hypothesis>=6.164.0",
    "numpy>=1.26",  # required by the OpenMM runner Kabsch-aligned RMSD tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biolab_runners"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["biolab_runners", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "D",   # pydocstyle
    "N",   # pep8-naming
    "S",   # bandit (security)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "C90", # mccabe cyclomatic complexity
    "RUF", # ruff-specific rules
    "ANN", # flake8-annotations
    "PT",  # flake8-pytest-style
]
ignore = [
    "D100",  # missing module docstring (allow for __init__.py)
    "D104",  # missing public package docstring
    "D107",  # missing docstring in __init__
    "S603",  # subprocess call — pipeline shells out to boltz CLI
    "S607",  # partial path for subprocess — boltz binary is on PATH
    "S602",  # subprocess shell — not used
    # RUF001/002/003: ambiguous unicode (e.g. "α" instead of "a"). This
    # is a computational-biology library where Greek letters, ×, −, and
    # similar glyphs are correct domain notation (Cα, RMSD, ångström),
    # not ambiguous characters. ASCII transliteration would hurt
    # readability for the intended audience.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",     # docstring rules (tests are self-documenting via test names)
    "S",     # security (asserts, subprocess mocks are safe in tests)
    "ARG",   # unused arguments (fixtures may pass extras)
    "TC003", # type-checking block (tests import broadly)
    "SIM117", # combine multiple with statements (test readability)
    "ANN",   # annotations (tests use pytest fixtures; full annotations noisy)
    "PT",    # pytest-style (existing tests use class grouping, not function-style)
    "N802",  # camelCase function names (test mocks mirror OpenMM's camelCase API)
    "N815",  # mixedCase in class scope (test mocks mirror OpenMM's mixedCase attrs)
]

# --- Pyright ---
[tool.pyright]
# Type-check both production code AND tests. Tests are first-class code:
# they ship in the repo, they're reviewed, they have a coverage gate.
# The "mock infrastructure noise" rationale (hypothesis decorators, etc.)
# applies to bioml-tools' hypothesis stubs, not biolab-runners — the
# errors that surface when tests/ is included are real type issues in
# production code (e.g. `to_dict()` returning `object` instead of
# `dict[str, object]`). Letting them through the gate hides real bugs.
include = ["biolab_runners", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# `mdtraj` is an optional dep under the `openmm` extra; imported lazily
# inside `biolab_runners/openmm/offline_gate.py`. Pyright can't see the
# dep unless the extra is installed, so silence the missing-import
# diagnostic specifically.
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
# Hypothesis decorators (@given, @settings) are untyped by design; they
# obscure the inner function's signature in pyright's strict mode. This
# is a known third-party-stub gap, not a real type bug. Same rationale
# as the bioml-tools config (see AGENTS.md "Pyright mode" section).
reportUntypedFunctionDecorator = false

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=biolab_runners",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    # The current pytest suite runs entirely with mocks + numpy + the
    # optional `mdtraj` extra. No tests require real GPU hardware,
    # the live boltz CLI, or network access — so no markers are
    # defined. Add markers here when such tests are introduced and
    # gate them via `--strict-markers` + `pytest -m <marker>` in CI.
]

# --- Coverage ---
[tool.coverage.run]
branch = true
source = ["biolab_runners"]
omit = [
    "biolab_runners/__init__.py",
]

[tool.coverage.report]
# Threshold enforced via `make validate` → pytest → --cov-fail-under below.
# Current floor: 70%. Aspirational target: 80% (needs integration tests
# for runner.py/system_builder.py OpenMM-coupled paths).
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
